# CPU smoke test for MMLongBench import/integration, not a multimodal baseline.
retrieval:
  top_k: 3
  candidate_k: 20
  cache_visual_embeddings: true
  fusion:
    mode: reliability
    text_scale: 8.0
    visual_scale: 20.0
    min_text_weight: 0.25
    max_text_weight: 0.75
generation:
  max_new_tokens: 192
pdf:
  dpi: 120
  max_pages_per_doc: null
  text_mode: native
runtime:
  visual_backend: none
  generation_backend: extractive
  device: cpu
  demo_mode: true
grounding:
  enabled: true
  verify: true
  verify_mode: lexical
  granularity: claim
  repair_missing_citations: false
  lexical_min_overlap: 0.6
refusal:
  enabled: true
  score_threshold: 0.05
  use_retrieval_gate: true
  use_model_refusal: true
  use_citation_gate: true
  use_grounding_gate: true
retry:
  max_retry: 0
evaluation:
  seed: 42
